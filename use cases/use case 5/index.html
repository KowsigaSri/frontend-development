<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="search-container">
        <h2>Live Search</h2>


        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search items...">


        <ul id="itemList">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
            <li>Angular</li>
            <li>Vue</li>
            <li>Node.js</li>
            <li>Python</li>
        </ul>
    </div>


    <script src="script.js"></script>
</body>
</html>
