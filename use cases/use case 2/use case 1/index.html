<!DOCTYPE html>
<html>
<head>
    <title>Simple Multi Section Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Simple Website</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h2>Home</h2>
        <p>Welcome to our simple multi section website.</p>
    </section>

    <!-- About Section -->
    <section id="about">
        <h2>About</h2>
        <p>This website is created to understand HTML, CSS and basic JavaScript.</p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: example@gmail.com</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
