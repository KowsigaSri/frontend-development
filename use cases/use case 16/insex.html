<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAQ Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="faq-container">
    <h1>Frequently Asked Questions</h1>


    <div class="faq-item">
      <div class="question">What is JavaScript?</div>
      <div class="answer">JavaScript is a programming language used to make web pages interactive.</div>
    </div>


    <div class="faq-item">
      <div class="question">What is HTML?</div>
      <div class="answer">HTML stands for HyperText Markup Language and is used to structure web content.</div>
    </div>


    <div class="faq-item">
      <div class="question">What is CSS?</div>
      <div class="answer">CSS is used to style and layout web pages.</div>
    </div>


  </div>


  <script src="script.js"></script>
